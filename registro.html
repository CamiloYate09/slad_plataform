<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crea tu cuenta en CityStream." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0a0a0a" />

  <link rel="icon" href="image/favicon-32x32.png" type="image/png" />
  <link rel="apple-touch-icon" href="image/apple-touch-icon.png" />
  <link rel="preload" href="static/fonts/Geist-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="static/fonts/Bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="static/css/style.css" />

  <title>Crear cuenta — CityStream</title>

  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' https://accounts.google.com;
    style-src 'self' 'unsafe-inline' https://accounts.google.com;
    font-src 'self';
    img-src 'self' data: https://lh3.googleusercontent.com;
    connect-src 'self' https://api.citystream.tech http://localhost:8080 https://accounts.google.com;
    frame-src https://accounts.google.com;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'none';
  " />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" />
</head>
<body>

<div class="bg-texture" aria-hidden="true"></div>

<nav id="navbar" aria-label="Navegacion principal">
  <a href="/" class="nav-logo" title="CityStream - Ir al inicio">CityStream 🇨🇴</a>
  <div class="nav-cta">
    <a href="/login.html" class="btn-outline-sm">Iniciar sesión</a>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-card">
    <header class="auth-header">
      <span class="section-label">Tu cuenta</span>
      <h1>Crea tu cuenta</h1>
      <p class="auth-sub">Una cuenta, todas las ciudades.</p>
    </header>

    <p class="auth-aviso" data-auth-aviso role="status" hidden></p>

    <form class="auth-form" data-auth="registro" novalidate>
      <div class="auth-field">
        <label for="email">Correo electrónico</label>
        <input
          type="email" id="email" name="email" required
          autocomplete="email" autocapitalize="off" spellcheck="false"
          placeholder="tu@correo.com" />
      </div>

      <div class="auth-field">
        <label for="username">Nombre de usuario</label>
        <input
          type="text" id="username" name="username" required
          minlength="3" maxlength="50" pattern="[a-zA-Z0-9_\-]{3,50}"
          autocomplete="username" autocapitalize="off" spellcheck="false"
          aria-describedby="username-ayuda"
          placeholder="camilo_yate" />
        <p class="auth-ayuda" id="username-ayuda">Entre 3 y 50 caracteres. Letras, números, guion y guion bajo.</p>
      </div>

      <div class="auth-field">
        <label for="password">Contraseña</label>
        <div class="auth-password">
          <input
            type="password" id="password" name="password" required
            minlength="8" autocomplete="new-password"
            aria-describedby="password-ayuda" />
          <button type="button" class="auth-toggle" data-toggle-password="password" aria-pressed="false">Mostrar</button>
        </div>
        <p class="auth-ayuda" id="password-ayuda">Mínimo 8 caracteres. Una frase larga es más segura que símbolos raros.</p>
      </div>

      <div class="auth-field">
        <label for="password2">Repite la contraseña</label>
        <input
          type="password" id="password2" name="password2" required
          minlength="8" autocomplete="new-password" />
      </div>

      <label class="auth-check">
        <input type="checkbox" name="consentimiento" required />
        <span>Acepto los <a href="/terminos.html">Términos de Uso</a> y la <a href="/privacidad.html">Política de Tratamiento de Datos</a>, conforme a la Ley 1581 de 2012.</span>
      </label>

      <button type="submit" class="auth-submit">Crear cuenta</button>
      <p class="auth-status" data-auth-status role="status" aria-live="polite"></p>
    </form>

    <div class="auth-oauth" data-auth-oauth hidden>
      <span class="auth-sep">o continúa con</span>
      <div data-oauth-google></div>
    </div>

    <p class="auth-alt">¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a></p>
  </div>
</main>

<script src="static/js/auth-config.js"></script>
<script src="static/js/auth.js"></script>
</body>
</html>
