<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crea una contraseña nueva para tu cuenta de CityStream." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />

  <link rel="icon" href="../image/favicon-32x32.png" type="image/png" />
  <link rel="apple-touch-icon" href="../image/apple-touch-icon.png" />
  <link rel="preload" href="../static/fonts/Geist-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../static/fonts/Bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../static/css/style.css" />

  <title>Nueva contraseña — CityStream</title>

  <!-- El token viaja en la URL: que no salga en el Referer hacia ningún lado -->
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data:;
    connect-src 'self' https://api.citystream.tech http://localhost:8080;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'none';
  " />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" />
</head>
<body>
<script src="../static/js/theme.js"></script>

<nav id="navbar" aria-label="Navegacion principal">
  <a href="/" class="nav-logo" title="CityStream - Ir al inicio">CityStream 🇨🇴</a>
  <div class="nav-cta">
    <button class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
      <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <a href="/login.html" class="btn-outline-sm">Volver al login</a>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-card">
    <header class="auth-header">
      <span class="section-label">Tu cuenta</span>
      <h1>Crea una contraseña nueva</h1>
      <p class="auth-sub">Después de guardarla, entra con ella.</p>
    </header>

    <form class="auth-form" data-auth="reset" novalidate>
      <div class="auth-field">
        <label for="password">Contraseña nueva</label>
        <div class="auth-password">
          <input
            type="password" id="password" name="password" required
            minlength="8" autocomplete="new-password"
            aria-describedby="password-ayuda" />
          <button type="button" class="auth-toggle" data-toggle-password="password" aria-pressed="false">Mostrar</button>
        </div>
        <p class="auth-ayuda" id="password-ayuda">Mínimo 8 caracteres.</p>
      </div>

      <div class="auth-field">
        <label for="password2">Repite la contraseña</label>
        <input
          type="password" id="password2" name="password2" required
          minlength="8" autocomplete="new-password" />
      </div>

      <button type="submit" class="auth-submit">Guardar contraseña</button>
      <p class="auth-status" data-auth-status role="status" aria-live="polite"></p>
    </form>

    <p class="auth-alt">¿El enlace ya no sirve? <a href="/olvide-password.html">Pide uno nuevo</a></p>
  </div>
</main>

<script src="../static/js/auth.js"></script>
</body>
</html>
